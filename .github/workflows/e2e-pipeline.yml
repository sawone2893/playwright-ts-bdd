name: E2E Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - staging
      browser:
        description: 'Target Browser'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

jobs:
  test:
    name: Run Automated E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      - name: Ensure Reports Directory Exists
        run: mkdir -p reports

      # Keep the test outcome so reports can still be generated before the job fails.
      - name: Execute Cucumber Test Suite
        id: cucumber
        continue-on-error: true
        run: npm test
        env:
          ENV: ${{ github.event.inputs.environment || 'qa' }}
          BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
          HEADLESS: 'true'
          CI: 'true'

      # 2. Generate the Extent-style HTML report
      - name: Generate HTML Report
        if: always()
        run: node generate-report.cjs
        env:
          ENV: ${{ github.event.inputs.environment || 'qa' }}
          BROWSER: ${{ github.event.inputs.browser || 'chromium' }}

      # 3. Upload the entire reports/ directory
      - name: Upload Test Report & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-execution-report
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      # 4. Enforce the original test outcome after report generation and upload
      - name: Verify Test Results
        if: always()
        env:
          CUCUMBER_OUTCOME: ${{ steps.cucumber.outcome }}
        run: |
          if [ "$CUCUMBER_OUTCOME" != "success" ]; then
            echo "Cucumber test suite did not succeed (outcome: $CUCUMBER_OUTCOME)."
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const reportPath = 'reports/cucumber-report.json';

          if (!fs.existsSync(reportPath)) {
            console.error('Cucumber JSON report file was not found.');
            process.exit(1);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const scenarios = report.flatMap(feature => feature.elements || [])
            .filter(element => element.type === 'scenario');

          if (scenarios.length === 0) {
            console.error('Cucumber report contains no executed scenarios.');
            process.exit(1);
          }

          const unsuccessfulStatuses = new Set(['failed', 'undefined', 'pending', 'ambiguous']);
          const unsuccessfulSteps = scenarios.flatMap(scenario =>
            (scenario.steps || [])
              .filter(step => unsuccessfulStatuses.has(step.result?.status))
              .map(step => `${scenario.name}: ${step.name} (${step.result.status})`)
          );

          if (unsuccessfulSteps.length > 0) {
            console.error('Cucumber report contains unsuccessful steps:');
            unsuccessfulSteps.forEach(step => console.error(`- ${step}`));
            process.exit(1);
          }

          console.log(`All ${scenarios.length} Cucumber scenarios passed.`);
          NODE