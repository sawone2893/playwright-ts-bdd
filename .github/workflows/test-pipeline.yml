name: Playwright Cucumber E2E Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - staging
      browser:
        description: 'Target Browser'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

jobs:
  test:
    name: Run Automated E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      # Run test suite directly without '|| true'
      - name: Execute Cucumber Test Suite
        run: npm test
        env:
          ENV: ${{ github.event.inputs.environment || 'qa' }}
          BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
          HEADLESS: 'true'
          CI: 'true'

      # Upload report & failure artifacts whether tests pass or fail
      - name: Upload Test Report & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: |
            reports/html-report/index.html
            reports/screenshots/
            reports/videos/
          retention-days: 14