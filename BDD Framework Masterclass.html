<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playwright + Cucumber BDD 7-Day Masterclass | Full Instructor Speaking Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #090d16;
      --bg-surface: #101626;
      --bg-card: #151d33;
      --bg-code: #0b1120;
      --border-subtle: #1e293b;
      --border-accent: #334155;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.15);
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #fb7185;
      --indigo: #818cf8;
      --purple: #c084fc;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --sidebar-width: 320px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Sidebar Navigation */
    aside.sidebar {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 50;
    }

    .brand {
      padding: 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand-text span {
      font-size: 11px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      text-decoration: none;
      user-select: none;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    .nav-item.active {
      background: var(--primary-glow);
      border-color: rgba(56, 189, 248, 0.3);
      color: var(--primary);
      font-weight: 600;
    }

    .nav-item-day {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .day-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.08);
      padding: 3px 7px;
      border-radius: 4px;
      color: #cbd5e1;
    }

    .nav-item.active .day-badge {
      background: var(--primary);
      color: #0b1120;
      font-weight: 700;
    }

    .time-badge {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
    }

    .instructor-footer {
      padding: 16px;
      border-top: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.2);
    }

    .instructor-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
    }

    /* Main Content */
    main.content {
      margin-left: var(--sidebar-width);
      flex: 1;
      padding: 40px 48px;
      max-width: 1200px;
    }

    /* Header Bar */
    .top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .breadcrumbs span.current {
      color: var(--primary);
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .view-toggle {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 4px;
      border-radius: 8px;
    }

    .toggle-opt {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .toggle-opt.active {
      background: var(--primary);
      color: #0b1120;
    }

    .timer-deck {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 6px 14px;
      border-radius: 20px;
    }

    .timer-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      color: var(--emerald);
    }

    .timer-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .timer-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* Day Banner */
    .day-banner {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.6) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }

    .day-banner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--primary);
    }

    .day-meta-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 12px;
      font-family: 'JetBrains Mono', monospace;
    }

    .day-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
      margin-bottom: 8px;
    }

    .day-objective {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 850px;
    }

    /* Distribution Pills */
    .time-distribution {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .dist-card {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .dist-label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    .dist-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #cbd5e1;
      margin-top: 2px;
    }

    /* Module Cards */
    .module-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .module-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
    }

    .module-header h3 {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .badge-blue { background: rgba(56, 189, 248, 0.15); color: var(--primary); }
    .badge-green { background: rgba(52, 211, 153, 0.15); color: var(--emerald); }
    .badge-amber { background: rgba(251, 191, 36, 0.15); color: var(--amber); }
    .badge-rose { background: rgba(251, 113, 133, 0.15); color: var(--rose); }
    .badge-purple { background: rgba(192, 132, 252, 0.15); color: var(--purple); }

    .module-body {
      padding: 24px;
    }

    /* Speech/Script Styling */
    .speech-box {
      background: rgba(192, 132, 252, 0.05);
      border: 1px solid rgba(192, 132, 252, 0.25);
      border-left: 4px solid var(--purple);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .speech-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--purple);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .speech-script {
      font-size: 14.5px;
      line-height: 1.7;
      color: #e2e8f0;
      font-style: italic;
    }

    .speech-script strong {
      color: #fff;
      font-style: normal;
      background: rgba(255, 255, 255, 0.06);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .speech-action {
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--amber);
      font-style: normal;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Checklist */
    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .check-box {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 2px solid var(--border-accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s;
    }

    .check-box.checked {
      background: var(--emerald);
      border-color: var(--emerald);
    }

    .check-box.checked::after {
      content: '✓';
      color: #0b1120;
      font-size: 11px;
      font-weight: 900;
    }

    /* Code Blocks */
    .code-container {
      margin-top: 12px;
      background: var(--bg-code);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid var(--border-subtle);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
    }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border-accent);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'JetBrains Mono', monospace;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    pre code {
      display: block;
      padding: 16px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #e2e8f0;
    }

    /* Pitfall Cards */
    .pitfall-box {
      background: rgba(251, 113, 133, 0.05);
      border: 1px solid rgba(251, 113, 133, 0.2);
      border-radius: 8px;
      padding: 18px;
      margin-top: 16px;
    }

    .pitfall-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--rose);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .pitfall-desc {
      font-size: 13.5px;
      color: #cbd5e1;
    }

    .trainer-tip {
      background: rgba(251, 191, 36, 0.06);
      border-left: 3px solid var(--amber);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      font-size: 13.5px;
      color: #cbd5e1;
      margin-top: 16px;
    }

    .trainer-tip strong {
      color: var(--amber);
    }

    /* Floating Navigation Controls */
    .view-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.05);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #fff;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 100;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      aside.sidebar { display: none; }
      main.content { margin-left: 0; padding: 20px; }
      .time-distribution { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">
        <h1>BDD Framework Masterclass</h1>
        <span>Instructor Cockpit</span>
      </div>
    </div>

    <div class="nav-list" id="navList"></div>

    <div class="instructor-footer">
      <div class="instructor-card">
        <div class="avatar">TR</div>
        <div>
          <div style="font-size: 12px; font-weight: 700; color: #fff;">Trainer Mode</div>
          <div style="font-size: 11px; color: var(--text-dim);">Spoken Script Active</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Work Area -->
  <main class="content">
    <div class="top-meta">
      <div class="breadcrumbs">
        <span>Playwright Masterclass</span>
        <span>/</span>
        <span class="current" id="crumbDay">Day 1</span>
      </div>

      <div class="top-actions">
        <div class="view-toggle">
          <button class="toggle-opt active" id="btnScriptMode" onclick="toggleScriptMode(true)">🎙️ Script & Delivery</button>
          <button class="toggle-opt" id="btnCodeMode" onclick="toggleScriptMode(false)">💻 Code Only</button>
        </div>

        <div class="timer-deck">
          <span style="font-size: 12px; color: var(--text-dim);">TIMER:</span>
          <div class="timer-display" id="timer">00:00:00</div>
          <button class="timer-btn" id="startTimerBtn">Start</button>
          <button class="timer-btn" id="resetTimerBtn">Reset</button>
        </div>
      </div>
    </div>

    <!-- Active Day Container -->
    <div id="dayContentArea"></div>

    <!-- Bottom Navigation -->
    <div class="view-controls">
      <button class="nav-btn" id="prevDayBtn">← Previous Day</button>
      <button class="nav-btn" id="nextDayBtn">Next Day →</button>
    </div>
  </main>

  <div class="toast" id="toast">Code copied to clipboard!</div>

  <script>
    let showScript = true;

    const curriculumData = [
      {
        day: 1,
        title: "Modern Test Automation Foundations & Setup",
        subtitle: "Node.js, TypeScript, and Playwright Core Architecture",
        objective: "Understand how Playwright operates under the hood, initialize a strict TypeScript ECMAScript Module (ESM) project, and execute an isolated browser test without framework abstractions.",
        distribution: { theory: "45 Mins", practice: "50 Mins", drill: "15 Mins", recap: "10 Mins" },
        spokenOpening: "Welcome, everyone. Today we are setting the architectural foundation for an enterprise test automation framework. You might already know Selenium WebDriver, where every single command—whether a click, a findElement, or text input—is packaged into an HTTP JSON request sent across a local port to a separate driver executable. When you scale that to hundreds of tests, HTTP handshakes and port exhaustion become massive bottlenecks. Playwright fundamentally re-engineers this. It connects straight to the browser engine's internal Chrome DevTools Protocol over a persistent, duplex WebSocket. There is zero HTTP polling. More importantly, Playwright introduces the concept of lightweight Browser Contexts—meaning we can launch a single browser process and spin up dozens of isolated, private incognito sessions in milliseconds without the memory penalty of running multiple Chrome instances.",
        theoryChecklist: [
          "Selenium vs Playwright: HTTP JSON Wire protocol overhead vs direct CDP / WebSocket connections.",
          "Process Hierarchy: Single heavy OS Browser process vs lightweight isolated BrowserContexts vs Pages.",
          "ESM Standard: Why \"type\": \"module\" is mandatory in package.json to prevent modern import collisions.",
          "TypeScript Runtime with tsx: In-memory compilation without separate, slow transpile-and-run steps."
        ],
        theoryLectureScript: "Let me draw this on the board for you. At the top level, we have the OS Browser Process. When you run Chromium or Firefox, your operating system allocates hundreds of megabytes of memory. In legacy frameworks, to get clean cookies, you had to shut down and reopen that heavy process for every scenario. In Playwright, that process launches once. Underneath it, we create a BrowserContext. Think of a BrowserContext like opening a brand new Incognito tab: its cookies, local storage, indexedDB, and cache are 100% isolated. Opening a Context takes about 15 milliseconds and uses negligible RAM. Under the Context, you have the Page—your actual tab. This 3-tier hierarchy is why our framework will execute 5 times faster than standard Selenium suites.",
        trainerTips: "Draw the process tree on the board: 1 OS Browser process running 4 isolated contexts side-by-side. Make students see that they don't need 4 separate browsers to get clean cookies.",
        practicalSteps: [
          {
            title: "Step 1: Initialize Workspace & Install Binaries",
            desc: "Run terminal commands to install dependencies and required OS-level browser packages:",
            voiceover: "Alright team, open your VS Code terminal. Let's create our workspace folder. Notice we are installing @types/node right at the start. If you skip @types/node, TypeScript will immediately throw an error when we touch process.env later. Let's run these commands together.",
            code: "mkdir playwright-bdd-framework && cd playwright-bdd-framework\nnpm init -y\nnpm install --save-dev @playwright/test typescript tsx @types/node\nnpx playwright install --with-deps chromium"
          },
          {
            title: "Step 2: Setup Strict tsconfig.json",
            desc: "Add types: [\"node\"] to prevent 'Cannot find name process' and set moduleResolution to bundler:",
            voiceover: "Now open tsconfig.json. Pay very close attention to three keys: first, rootDir must be set to ./ to prevent common source root errors. Second, moduleResolution must be bundler. If you leave it at node10, Node will throw deprecation warnings in modern versions. Third, types must include node.",
            code: '{\n  "compilerOptions": {\n    "target": "ES2022",\n    "module": "ESNext",\n    "moduleResolution": "bundler",\n    "rootDir": "./",\n    "outDir": "./dist",\n    "types": ["node"],\n    "esModuleInterop": true,\n    "strict": true,\n    "skipLibCheck": true,\n    "resolveJsonModule": true\n  },\n  "include": ["src/**/*"]\n}'
          },
          {
            title: "Step 3: Direct Native Test (src/sample.ts)",
            desc: "Write pure Playwright code without any abstractions to cement the core concepts:",
            voiceover: "Let's create src/sample.ts. Notice how we explicitly instantiate browser, then context, then page. When we execute this, watch how fast the context opens and closes. Notice also that we don't have explicit sleep calls—Playwright locators auto-wait for elements to be visible and stable before clicking.",
            code: "import { chromium } from '@playwright/test';\n\nasync function run() {\n  console.log('Launching browser process...');\n  const browser = await chromium.launch({ headless: false, slowMo: 300 });\n  const context = await browser.newContext();\n  const page = await context.newPage();\n\n  await page.goto('https://www.saucedemo.com');\n  await page.locator('#user-name').fill('standard_user');\n  await page.locator('#password').fill('secret_sauce');\n  await page.locator('#login-button').click();\n\n  console.log('Header text:', await page.locator('.title').textContent());\n  await context.close();\n  await browser.close();\n}\nrun();"
          }
        ],
        pitfall: {
          title: "Debugging Drill: Missing Types & Unhandled Promises",
          desc: "Have students delete '@types/node' or omit 'await' from page.goto(). Show how TypeScript red-lines 'process.env' and how Node unhandled rejections crash tests silently.",
          spokenWalkthrough: "Everyone, let's intentionally break our code. Remove the await keyword right before page.goto(). Now run tsx src/sample.ts. Notice what happens: JavaScript returns a pending Promise and immediately moves to the next line before the page has even loaded! The test crashes with element not found. In modern automation, forgetting await is the number one cause of flaky tests. Always verify that asynchronous Playwright actions are properly awaited."
        },
        spokenClosing: "Today you proved the core architecture. You saw the browser, the context, and the page interacting directly via WebSockets. Tomorrow, we take this engine and marry it with Behavior-Driven Development using Cucumber.js and Gherkin."
      },
      {
        day: 2,
        title: "BDD Principles & Cucumber Integration with ESM",
        subtitle: "Feature Files, Step Definitions, and in-memory tsx Execution",

            code: "import { chromium, firefox, webkit, Browser, devices, BrowserContextOptions } from '@playwright/test';\n\nexport type BrowserType = 'chromium' | 'firefox' | 'webkit';\n\nexport class BrowserFactory {\n  static async getBrowser(browserName: BrowserType = 'chromium'): Promise<Browser> {\n    const options = { headless: process.env.HEADLESS !== 'false' };\n    switch (browserName.toLowerCase()) {\n      case 'firefox': return await firefox.launch(options);\n      case 'webkit': return await webkit.launch(options);\n      default: return await chromium.launch(options);\n    }\n  }\n\n  static getContextOptions(deviceName?: string): BrowserContextOptions {\n    if (deviceName && devices[deviceName]) {\n      return { ...devices[deviceName], recordVideo: { dir: 'reports/videos/' } };\n    }\n    return { viewport: { width: 1920, height: 1080 }, recordVideo: { dir: 'reports/videos/' } };\n  }\n}"

            code: "import { Page, Locator, expect } from '@playwright/test';\n\nexport abstract class BasePage {\n  readonly page: Page;\n  constructor(page: Page) { this.page = page; }\n\n  async goto(url: string): Promise<void> {\n    await this.page.goto(url, { waitUntil: 'domcontentloaded' });\n  }\n\n  protected getLocator(selector: string | Locator): Locator {\n    return typeof selector === 'string' ? this.page.locator(selector) : selector;\n  }\n\n  async click(selector: string | Locator): Promise<void> {\n    const el = this.getLocator(selector);\n    await el.waitFor({ state: 'visible' });\n    await el.click();\n  }\n\n  async type(selector: string | Locator, text: string): Promise<void> {\n    const el = this.getLocator(selector);\n    await el.waitFor({ state: 'visible' });\n    await el.fill('');\n    await el.fill(text);\n  }\n\n  async expectToHaveText(selector: string | Locator, text: string): Promise<void> {\n    await expect(this.getLocator(selector)).toHaveText(text);\n  }\n}"

      },
      {

        theoryChecklist: [

    let currentDayIndex = 0;
    let timerSeconds = 0;
    let timerInterval = null;

    function toggleScriptMode(enableScript) {
      showScript = enableScript;
      document.getElementById('btnScriptMode').classList.toggle('active', enableScript);
      document.getElementById('btnCodeMode').classList.toggle('active', !enableScript);
      renderActiveDay();
    }

    function renderNav() {
      const navList = document.getElementById('navList');
      navList.innerHTML = '';
      curriculumData.forEach((item, index) => {
        const navEl = document.createElement('a');
        navEl.className = `nav-item ${index === currentDayIndex ? 'active' : ''}`;
        navEl.onclick = () => selectDay(index);
        navEl.innerHTML = `
          <div class="nav-item-day">
            <span class="day-badge">D${item.day}</span>
            <span>${item.title.split(':')[0]}</span>
          </div>
          <span class="time-badge">2h</span>
        `;
        navList.appendChild(navEl);
      });
    }

    function renderActiveDay() {
      const data = curriculumData[currentDayIndex];
      document.getElementById('crumbDay').textContent = `Day ${data.day}`;

      const container = document.getElementById('dayContentArea');
      container.innerHTML = `
        <div class="day-banner">
          <div class="day-meta-tag">SESSION MODULE 0${data.day}</div>
          <h2 class="day-title">${data.title}</h2>
          <p class="day-objective">${data.objective}</p>

          <div class="time-distribution">
            <div class="dist-card">
              <div class="dist-label">Concept & Architecture</div>
              <div class="dist-val">${data.distribution.theory}</div>
            </div>
            <div class="dist-card">
              <div class="dist-label">Live Implementation</div>
              <div class="dist-val">${data.distribution.practice}</div>
            </div>
            <div class="dist-card">
              <div class="dist-label">Debugging Drill</div>
              <div class="dist-val">${data.distribution.drill}</div>
            </div>
            <div class="dist-card">
              <div class="dist-label">Recap & Wrap-Up</div>
              <div class="dist-val">${data.distribution.recap}</div>
            </div>
          </div>
        </div>

        ${showScript ? `
        <!-- Spoken Opening Script -->
        <div class="speech-box">
          <div class="speech-title"><span>🎙️</span> Opening Hook & Intro (Say this out loud in Minute 0-5)</div>
          <p class="speech-script">"${data.spokenOpening}"</p>
          <div class="speech-action">💡 Action: Greet students, share screen, display today's architecture goal.</div>
        </div>
        ` : ''}

        <!-- Theory Section -->
        <div class="module-card">
          <div class="module-header">
            <h3><span>📖</span> Architectural Concepts & Theory</h3>
            <span class="badge-pill badge-blue">Deliver First 45 Mins</span>
          </div>
          <div class="module-body">
            ${showScript ? `
            <div class="speech-box" style="margin-bottom: 20px;">
              <div class="speech-title"><span>🎙️</span> Lecture Deep-Dive Script (Explain these principles)</div>
              <p class="speech-script">"${data.theoryLectureScript}"</p>
            </div>
            ` : ''}

            <ul class="checklist">
              ${data.theoryChecklist.map(item => `
                <li class="checklist-item">
                  <div class="check-box" onclick="toggleCheck(this)"></div>
                  <span>${item}</span>
                </li>
              `).join('')}
            </ul>

            <div class="trainer-tip">
              <strong>Trainer Delivery Note:</strong> ${data.trainerTips}
            </div>
          </div>
        </div>

        <!-- Implementation Section -->
        <div class="module-card">
          <div class="module-header">
            <h3><span>💻</span> Live Hands-On Implementation</h3>
            <span class="badge-pill badge-green">50 Mins Live Coding</span>
          </div>
          <div class="module-body">
            ${data.practicalSteps.map((step, idx) => `
              <div style="${idx > 0 ? 'margin-top: 28px;' : ''}">
                <div style="font-weight: 700; font-size: 14.5px; color: #fff;">${step.title}</div>
                <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">${step.desc}</div>

                ${showScript ? `
                <div class="speech-box" style="margin-top: 10px; margin-bottom: 12px; padding: 12px 16px;">
                  <div class="speech-title" style="font-size: 11px;"><span>🎙️</span> Live Coding Voiceover:</div>
                  <p class="speech-script" style="font-size: 13px;">"${step.voiceover}"</p>
                </div>
                ` : ''}

                <div class="code-container">
                  <div class="code-header">
                    <span>TERMINAL / CODE BUFFER</span>
                    <button class="copy-btn" onclick="copyCode(this)">Copy Code</button>
                  </div>
                  <pre><code>${escapeHtml(step.code)}</code></pre>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Debugging Drill Section -->
        <div class="module-card">
          <div class="module-header">
            <h3><span>⚠️</span> Debugging Drill & Student Pitfalls</h3>
            <span class="badge-pill badge-rose">15 Mins Fault Injection</span>
          </div>
          <div class="module-body">
            <div class="pitfall-box">
              <div class="pitfall-title"><span>⚡</span> ${data.pitfall.title}</div>
              <div class="pitfall-desc">${data.pitfall.desc}</div>

              ${showScript ? `
              <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(251, 113, 133, 0.2);">
                <div style="font-size: 11px; font-weight: 700; color: var(--rose); text-transform: uppercase;">🎙️ Fault-Injection Walkthrough:</div>
                <p style="font-size: 13px; font-style: italic; color: #fecdd3; margin-top: 4px;">"${data.pitfall.spokenWalkthrough}"</p>
              </div>
              ` : ''}
            </div>
          </div>
        </div>

        ${showScript ? `
        <!-- Closing Wrap Up -->
        <div class="speech-box" style="border-left-color: var(--emerald); background: rgba(52, 211, 153, 0.05);">
          <div class="speech-title" style="color: var(--emerald);"><span>🎯</span> Wrap-Up & Next Session Hook (Last 10 Mins)</div>
          <p class="speech-script">"${data.spokenClosing}"</p>
          <div class="speech-action">💡 Action: Open floor for 2-3 questions, verify students commit their working code to Git.</div>
        </div>
        ` : ''}
      `;

      // Update Nav Buttons
      document.getElementById('prevDayBtn').disabled = currentDayIndex === 0;
      document.getElementById('nextDayBtn').disabled = currentDayIndex === curriculumData.length - 1;
      document.getElementById('prevDayBtn').style.opacity = currentDayIndex === 0 ? '0.4' : '1';
      document.getElementById('nextDayBtn').style.opacity = currentDayIndex === curriculumData.length - 1 ? '0.4' : '1';
    }

    function selectDay(index) {
      currentDayIndex = index;
      renderNav();
      renderActiveDay();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleCheck(el) {
      el.classList.toggle('checked');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function copyCode(btn) {
      const code = btn.closest('.code-container').querySelector('code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2200);
      });
    }

    // Session Timer
    document.getElementById('startTimerBtn').onclick = function() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        this.textContent = 'Start';
      } else {
        this.textContent = 'Pause';
        timerInterval = setInterval(() => {
          timerSeconds++;
          const hrs = String(Math.floor(timerSeconds / 3600)).padStart(2, '0');
          const mins = String(Math.floor((timerSeconds % 3600) / 60)).padStart(2, '0');
          const secs = String(timerSeconds % 60).padStart(2, '0');
          document.getElementById('timer').textContent = `${hrs}:${mins}:${secs}`;
        }, 1000);
      }
    };

    document.getElementById('resetTimerBtn').onclick = function() {
      clearInterval(timerInterval);
      timerInterval = null;
      timerSeconds = 0;
      document.getElementById('timer').textContent = '00:00:00';
      document.getElementById('startTimerBtn').textContent = 'Start';
    };

    document.getElementById('prevDayBtn').onclick = () => {
      if (currentDayIndex > 0) selectDay(currentDayIndex - 1);
    };

    document.getElementById('nextDayBtn').onclick = () => {
      if (currentDayIndex < curriculumData.length - 1) selectDay(currentDayIndex + 1);
    };

    // Initial Load
    renderNav();
    renderActiveDay();
  </script>
</body>
</html>
